---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit (Ruby ${{ matrix.ruby }}, OpenVox ${{ matrix.openvox }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The Ruby versions bundled with the OpenVox agent packages
        include:
          - ruby: '3.2'
            openvox: '~> 8.0'
          - ruby: '4.0'
            openvox: '~> 9.0'
    env:
      OPENVOX_GEM_VERSION: ${{ matrix.openvox }}
      BUNDLE_WITHOUT: release
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Lint, syntax and unit tests
        run: bundle exec rake test rubocop

  integration:
    name: Integration (OpenSearch ${{ matrix.opensearch }}, OpenVox ${{ matrix.openvox }})
    runs-on: ubuntu-24.04
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        opensearch: ['2.19.7', '3.9.0']
        openvox: ['8', '9']
    steps:
      - uses: actions/checkout@v5
      - name: Apply the test manifests against a real cluster
        run: scripts/integration-test.sh ${{ matrix.opensearch }} ${{ matrix.openvox }}
